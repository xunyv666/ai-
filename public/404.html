<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 — 赵继晨</title>
<meta name="description" content="这个地址下没有内容。">
<meta name="theme-color" content="#0d0f1e">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f1e'/%3E%3Cpath d='M4 20 Q9.5 12.5 15 20 Q20.5 12.5 28 20' fill='none' stroke='%23eb8f4a' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#f4ece0;
  --ink-soft:rgba(244,236,224,.68);
  --ink-faint:rgba(244,236,224,.44);
  --night:#0d0f1e;
  --amber:#eb8f4a;
  --amber-sunk:#ff9b4a;
  --pill-fg:#171021;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100svh;
  background:var(--night); color:var(--ink);
  font-family:'Inter Tight','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-weight:400; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  display:flex; flex-direction:column; overflow-x:hidden;
}
h1,p{ margin:0; }
a{ color:inherit; }

/* 与首页同一片黄昏：静帧打底，万一静帧失败退到纯 CSS 渐变 */
.backdrop{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-color:var(--night);
  background-image:url("/assets/dusk-poster.jpg"),
    linear-gradient(to bottom,
      #0c0e1c 0%, #1b1a34 16%, #392b4a 34%, #653d4f 47%,
      #a1554a 56%, #e0965a 62.5%, #f9d3a0 66%,
      #6d4b3e 66.6%, #2b2439 73%, #0b0c19 100%);
  background-size:cover, cover;
  background-position:center 38%, center;
  background-repeat:no-repeat, no-repeat;
}
.veil{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(to bottom,
      rgba(7,8,18,.86) 0%, rgba(7,8,18,.34) 18%, rgba(7,8,18,.12) 42%,
      rgba(7,8,18,.30) 72%, rgba(7,8,18,.92) 100%),
    linear-gradient(102deg,
      rgba(7,8,18,.78) 0%, rgba(7,8,18,.40) 36%, rgba(7,8,18,.08) 62%, rgba(7,8,18,0) 78%),
    radial-gradient(140% 122% at 50% 46%, rgba(7,8,18,0) 40%, rgba(4,5,12,.62) 100%);
}
.grain{
  position:fixed; inset:-50%; z-index:2; pointer-events:none;
  opacity:.17; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}

/* 顶栏：与首页一致 */
.chrome{
  position:relative; z-index:40;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:max(14px, calc(env(safe-area-inset-top, 0px) + 12px)) clamp(18px, 3.6vw, 54px) 14px;
}
.mark{ display:flex; align-items:center; gap:9px; font-size:15px; letter-spacing:.01em; min-width:0; }
.mark svg{ width:24px; height:14px; flex-shrink:0; fill:none; stroke:var(--amber); stroke-width:2.1; stroke-linecap:round; }
.mark a{ text-decoration:none; }

main{
  position:relative; z-index:30; flex:1;
  display:flex; align-items:center;
  padding:clamp(24px, 6vw, 80px) clamp(18px, 3.6vw, 54px);
}

.copy{ max-width:min(560px, 100%); animation:rise .9s var(--ease) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

.eyebrow{
  display:inline-flex; align-items:center; gap:9px;
  font-size:12px; letter-spacing:.16em; color:var(--ink-soft);
  text-transform:uppercase;
}
.eyebrow::before{ content:''; width:5px; height:5px; border-radius:50%; background:var(--amber); flex-shrink:0; }

.code{
  margin-top:clamp(14px, 2.4vw, 22px);
  font-family:'Fraunces',Georgia,serif; font-weight:400;
  font-size:clamp(64px, 15vw, 132px); line-height:.92; letter-spacing:-.02em;
  color:var(--ink); opacity:.96;
}
h1{
  margin-top:clamp(10px, 1.6vw, 16px);
  font-family:'Fraunces',Georgia,serif; font-weight:400;
  font-size:clamp(26px, 4.6vw, 44px); line-height:1.18; letter-spacing:-.01em;
}
.sub{
  margin-top:clamp(14px, 2.2vw, 20px);
  font-size:clamp(14.5px, 1.5vw, 16.5px); line-height:1.72;
  color:var(--ink-soft); max-width:44ch;
}
.rule{
  margin:clamp(22px, 3.4vw, 34px) 0 0;
  height:1px; width:min(220px, 60%); border:0;
  background:linear-gradient(to right, var(--amber), rgba(235,143,74,0));
  opacity:.7;
}
.cta{ margin-top:clamp(22px, 3.2vw, 34px); display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.pill{
  display:inline-flex; align-items:center; justify-content:center;
  height:48px; padding:0 28px; border-radius:999px;
  background:var(--amber); color:var(--pill-fg);
  font-size:15px; font-weight:500; letter-spacing:.01em;
  text-decoration:none; white-space:nowrap; cursor:pointer;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 6px 22px -10px rgba(235,143,74,.9), 0 1px 0 rgba(255,255,255,.30) inset;
  -webkit-text-fill-color:var(--pill-fg);
  transition:transform .4s var(--ease), background .3s var(--ease);
}
.pill:hover,.pill:focus-visible{ transform:translateY(-2px); background:var(--amber-sunk); }
.pill:focus-visible,.quiet:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }
.quiet{
  font-size:14.5px; color:var(--ink-soft); text-decoration:none;
  border-bottom:1px solid rgba(244,236,224,.28); padding-bottom:2px;
  transition:color .3s var(--ease), border-color .3s var(--ease);
}
.quiet:hover{ color:var(--ink); border-color:var(--amber); }

.foot{
  position:relative; z-index:40;
  display:flex; justify-content:center;
  padding:14px clamp(18px, 4vw, 24px) max(16px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-size:12px; line-height:1.45; letter-spacing:.02em;
  color:var(--ink-faint); text-align:center;
}

@media (max-width:520px){
  .mark{ font-size:14px; }
  .mark svg{ display:none; }
  .cta{ gap:10px; }
  .pill{ width:100%; max-width:280px; height:44px; padding:0 20px; font-size:14px; }
  .quiet{ font-size:13.5px; }
}
@media (prefers-reduced-motion:reduce){
  .copy{ animation:none; }
  .pill{ transition:none; }
  .pill:hover{ transform:none; }
}
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="chrome">
  <div class="mark">
    <svg viewBox="0 0 26 8" aria-hidden="true"><path d="M1 6 Q7 -1 13 6 Q19 -1 25 6"/></svg>
    <a href="/">赵继晨</a>
  </div>
</header>

<main>
  <div class="copy">
    <p class="eyebrow">Error · 找不到页面</p>
    <p class="code">404</p>
    <h1>这一页，天黑了。</h1>
    <p class="sub">你要找的东西不在这里 —— 也许是网址打错了一个字，也许它还没被写下来。回到首页，从日落的那一面重新开始。</p>
    <hr class="rule">
    <div class="cta">
      <a class="pill" href="/">回到首页</a>
      <a class="quiet" href="mailto:603327998@qq.com">或写邮件给我</a>
    </div>
  </div>
</main>

<footer class="foot">© 2026 赵继晨 &nbsp;·&nbsp; 苏州 &nbsp;·&nbsp; 天黑了就收工</footer>

</body>
</html>
