<style>
:root{
  --ink:#f4ece0;
  --ink-soft:rgba(244,236,224,.68);
  --ink-faint:rgba(244,236,224,.44);
  --night:#0d0f1e;
  --rule:rgba(244,236,224,.18);
  --amber:#eb8f4a;
  --amber-sunk:#ff9b4a;
  --pill-fg:#171021;
  --ease:cubic-bezier(.22,.61,.36,1);
  --dusk:0;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--night);
  color:var(--ink);
  font-family:'Inter Tight','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
h1,h2,p,ol,li,figure{ margin:0; padding:0; }
ol{ list-style:none; }
a{ color:inherit; }

/* ============ 固定背景舞台 ============ */
.stage{
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background-color:var(--night);
  /* 第一层是静帧（100KB，秒开）；万一静帧也失败，退到纯 CSS 黄昏渐变 */
  background-image:url("assets/dusk-poster.jpg"),
    linear-gradient(to bottom,
      #0c0e1c 0%, #1b1a34 16%, #392b4a 34%, #653d4f 47%,
      #a1554a 56%, #e0965a 62.5%, #f9d3a0 66%,
      #6d4b3e 66.6%, #2b2439 73%, #0b0c19 100%);
  background-size:cover, cover;
  background-position:center, center;
  background-repeat:no-repeat, no-repeat;
}
/* CSS 落日：静帧/CSS 兜底时的太阳，随滚动下沉。
   transform 与 opacity 都是合成器属性，逐帧改不触发重绘。 */
.stage::before{
  content:''; position:absolute; left:39.5%; top:60.5%;
  width:clamp(90px, 9.5vw, 190px); height:clamp(90px, 9.5vw, 190px);
  border-radius:50%;
  background:radial-gradient(closest-side, #fff3d6 0%, #ffc178 42%, rgba(255,150,70,.42) 68%, rgba(255,150,70,0) 100%);
  transform:translate(-50%,-50%) translateY(calc(var(--dusk) * 44vh));
  opacity:calc(1 - var(--dusk) * .80);
}
/* 视频一旦就绪，CSS 落日立刻让位：否则它会以硬边圆盘叠在视频的落日之上 */
.stage.is-ready::before{ opacity:0; visibility:hidden; }
.stage video{
  position:absolute; top:50%; left:50%;
  width:100%; height:100%;
  transform:translate(-50%,-50%) scale(1.02);
  object-fit:cover;
  filter:saturate(.92) contrast(1.04);
  opacity:0; transition:opacity 1.1s var(--ease);
  background:transparent;
}
.stage.is-ready video{ opacity:1; }

/* 深色罩染：顶/底更重（给导航与页脚压底），左侧给文字留暗底 */
.veil{
  position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(to bottom,
      rgba(7,8,18,.86) 0%, rgba(7,8,18,.34) 18%, rgba(7,8,18,.10) 42%,
      rgba(7,8,18,.26) 72%, rgba(7,8,18,.90) 100%),
    linear-gradient(102deg,
      rgba(7,8,18,.74) 0%, rgba(7,8,18,.34) 34%, rgba(7,8,18,.06) 58%, rgba(7,8,18,0) 74%),
    radial-gradient(120% 88% at 62% 64%, rgba(255,152,72,.10) 0%, rgba(7,8,18,0) 60%),
    radial-gradient(140% 122% at 50% 46%, rgba(7,8,18,0) 40%, rgba(4,5,12,.62) 100%);
}
/* 入夜层：滚动越深越暗。只用 opacity，避免逐帧改动 background 造成全屏重绘。 */
.night{
  position:absolute; inset:0; pointer-events:none;
  background:#05060f;
  opacity:calc(.06 + var(--dusk) * .40);
}
.grain{
  position:absolute; inset:-50%; pointer-events:none;
  opacity:.17; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}
/* 缓慢漂移的海鸥剪影 */
.birds{ position:absolute; inset:0; pointer-events:none; color:#0a0b17; }
.birds svg{ position:absolute; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
.birds svg:nth-child(1){ width:74px; top:22%; left:-12%; opacity:.34; animation:glide 46s linear infinite; }
.birds svg:nth-child(2){ width:52px; top:34%; left:-12%; opacity:.26; animation:glide 67s linear infinite 8s; }
.birds svg:nth-child(3){ width:38px; top:44%; left:-12%; opacity:.20; animation:glide 88s linear infinite 22s; }
@keyframes glide{
  from{ transform:translate3d(0,0,0) }
  to{ transform:translate3d(128vw,0,0) }
}

/* ============ 顶栏 / 页脚 / 右侧章节轨 ============ */
.chrome{
  position:fixed; left:0; right:0; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:max(14px, calc(env(safe-area-inset-top, 0px) + 12px)) clamp(18px, 3.6vw, 54px) 14px;
  background:linear-gradient(to bottom, rgba(11,12,24,.90) 0%, rgba(11,12,24,.66) 68%, rgba(11,12,24,0) 100%);
}
.mark{ display:flex; align-items:center; gap:9px; font-size:15px; letter-spacing:.01em; min-width:0; }
.mark svg{ width:24px; height:14px; flex-shrink:0; fill:none; stroke:var(--amber); stroke-width:2.1; stroke-linecap:round; }
.nav{ display:flex; align-items:center; gap:clamp(14px, 2.4vw, 30px); flex-shrink:0; }
.nav a:not(.pill){
  color:var(--ink); text-decoration:none; font-size:14.5px;
  opacity:.86; cursor:pointer; transition:opacity .3s var(--ease);
}
.nav a:not(.pill):hover{ opacity:1; }
.pill{
  display:inline-flex; align-items:center; justify-content:center;
  height:40px; padding:0 22px; border-radius:999px;
  background:var(--amber); color:var(--pill-fg);
  font-size:14.5px; font-weight:500; letter-spacing:.01em;
  text-decoration:none; white-space:nowrap; cursor:pointer;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 6px 22px -10px rgba(235,143,74,.9), 0 1px 0 rgba(255,255,255,.30) inset;
  -webkit-text-fill-color:var(--pill-fg);
  transition:transform .4s var(--ease), background .3s var(--ease);
}
.nav .pill{ color:var(--pill-fg); -webkit-text-fill-color:var(--pill-fg); }
.pill:hover,.pill:focus-visible{ transform:translateY(-2px); background:var(--amber-sunk); }
.pill:focus-visible,.nav a:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

.foot{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; justify-content:center; pointer-events:none;
  padding:14px clamp(18px, 4vw, 24px) max(16px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-size:12px; line-height:1.45; letter-spacing:.02em;
  color:var(--ink-faint); text-align:center;
  background:linear-gradient(to top, rgba(11,12,24,.88) 0%, rgba(11,12,24,.62) 70%, rgba(11,12,24,0) 100%);
}
.hint{
  position:fixed; z-index:40; left:50%; bottom:max(52px, calc(env(safe-area-inset-bottom, 0px) + 48px));
  transform:translateX(-50%);
  font-size:11.5px; letter-spacing:.14em; color:var(--ink-faint);
  pointer-events:none; white-space:nowrap;
  transition:opacity .6s var(--ease);
}
.hint b{ font-weight:400; color:var(--amber); }

.rail{
  position:fixed; z-index:41; right:clamp(18px, 3.6vw, 54px); top:50%;
  transform:translateY(-50%);
  display:flex; align-items:center; gap:14px;
}
.rail .line{ position:relative; width:1px; height:132px; background:var(--rule); overflow:hidden; }
.rail .line i{ display:block; width:100%; height:100%; background:var(--amber); transform-origin:50% 0; transform:scaleY(0); }
.rail ol{ display:flex; flex-direction:column; gap:22px; }
.rail li{ display:flex; align-items:center; gap:10px; }
.rail li b{
  font-size:10.5px; font-weight:400; letter-spacing:.10em;
  color:var(--ink-faint); transition:color .4s var(--ease);
}
.rail li i{
  display:block; width:13px; height:1px; background:var(--rule); border-radius:1px;
  transition:width .5s var(--ease), background .5s var(--ease);
}
.rail li.on b{ color:var(--amber); }
.rail li.on i{ width:34px; background:var(--amber); }

.index{
  position:fixed; z-index:41; right:clamp(18px, 3.6vw, 54px);
  bottom:max(58px, calc(env(safe-area-inset-bottom, 0px) + 54px));
  text-align:right; pointer-events:none;
  font-variant-numeric:tabular-nums; font-size:11.5px; letter-spacing:.09em; color:var(--ink-faint);
}
.index strong{ display:block; font-size:15px; font-weight:400; letter-spacing:.02em; color:var(--ink-soft); }

/* ============ 面板层 ============ */
.panels{ position:fixed; inset:0; z-index:20; pointer-events:none; }
.panel{
  position:absolute; inset:0;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start;
  text-align:left;
  padding:max(96px, calc(env(safe-area-inset-top, 0px) + 80px)) clamp(18px, 5vw, 54px) max(80px, calc(env(safe-area-inset-bottom, 0px) + 72px));
}
/* 中文不能用 ch 量行宽：ch 是拉丁「0」的宽度，对中文会算出过窄的容器，
   标题会被挤成「能用的东 / 西。」这种孤字断行。这里一律用 rem 控行宽。 */
.panel-inner{ max-width:min(100%, 46rem); margin-right:auto; }
.eyebrow{
  display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  font-size:12.5px; letter-spacing:.13em; color:var(--ink-soft);
  margin-bottom:clamp(16px, 2vw, 24px); text-transform:uppercase;
}
.eyebrow::before{ content:''; width:5px; height:5px; border-radius:50%; background:var(--amber); flex-shrink:0; }
h1{
  font-family:'Fraunces','Songti SC','STSong','Noto Serif SC',Georgia,serif;
  font-weight:400; font-size:clamp(36px, 6.6vw, 92px);
  line-height:1.06; letter-spacing:-.005em;
  max-width:100%; text-wrap:balance;
  text-shadow:0 2px 34px rgba(6,7,16,.72);
}
.sub{
  margin-top:clamp(18px, 2.2vw, 26px);
  font-size:clamp(15px, 1.24vw, 18.5px); line-height:1.62;
  letter-spacing:.005em; color:var(--ink-soft);
  max-width:min(50ch, 100%); text-wrap:pretty;
}
.cta{ margin-top:clamp(26px, 3.2vw, 42px); pointer-events:auto; }
.cta .pill{ height:48px; padding:0 28px; font-size:15px; }

/* ============ 预加载：左下角计数 + 环形弧 ============ */
.boot{
  position:fixed; inset:0; z-index:90;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start;
  gap:14px; background:var(--night);
  padding:max(96px, calc(env(safe-area-inset-top, 0px) + 80px)) clamp(18px, 5vw, 54px) max(80px, calc(env(safe-area-inset-bottom, 0px) + 72px));
  transition:opacity .8s var(--ease), visibility .8s;
}
.boot.done{ opacity:0; visibility:hidden; }
.boot .ring{ width:44px; height:44px; transform:rotate(-90deg); }
.boot .ring circle{ fill:none; stroke-width:1.5; }
.boot .ring .bg{ stroke:var(--rule); }
.boot .ring .fg{ stroke:var(--amber); stroke-linecap:round; stroke-dasharray:119.4; stroke-dashoffset:119.4; }
.boot .num{
  display:flex; align-items:baseline; gap:9px;
  font-variant-numeric:tabular-nums; font-size:clamp(30px, 5vw, 46px);
  line-height:1; color:var(--ink); letter-spacing:.01em;
}
.boot .num span{ font-variant-numeric:tabular-nums; }
.boot .num em{ font-style:normal; font-size:13px; letter-spacing:.14em; color:var(--ink-faint); }
.boot .label{ font-size:12.5px; letter-spacing:.16em; color:var(--ink-faint); }

/* ============ 滚动轨道：唯一的页面高度 ============ */
.track{ position:relative; z-index:1; height:640vh; min-height:3600px; }

/* ============ 响应式 ============ */
@media (max-width:900px){
  .veil{
    background:
      linear-gradient(to bottom,
        rgba(7,8,18,.88) 0%, rgba(7,8,18,.42) 20%, rgba(7,8,18,.20) 44%,
        rgba(7,8,18,.34) 72%, rgba(7,8,18,.92) 100%),
      linear-gradient(102deg,
        rgba(7,8,18,.80) 0%, rgba(7,8,18,.42) 40%, rgba(7,8,18,.08) 66%, rgba(7,8,18,0) 82%),
      radial-gradient(140% 122% at 50% 46%, rgba(7,8,18,0) 38%, rgba(4,5,12,.68) 100%);
  }
  .night{ opacity:calc(.12 + var(--dusk) * .40); }
}
@media (max-width:720px){
  .nav a:not(.pill){ display:none; }
  .rail{ display:none; }
  .index{ display:none; }
  .mark{ font-size:14px; }
  /* 竖屏下 16:9 素材走 cover 会把落日裁到右边界之外，
     把取景框往左推一点，让太阳回到画面右三分之一处。 */
  .stage video{ object-position:60% center; }
  .nav .pill{ height:38px; padding:0 16px; font-size:13.5px; }
  .panel-inner{ max-width:100%; }
  h1{ max-width:13ch; font-size:clamp(30px, 9.4vw, 50px); }
  .sub{ font-size:15px; max-width:100%; }
  .panel,.boot{ padding:max(88px, calc(env(safe-area-inset-top, 0px) + 72px)) 18px max(84px, calc(env(safe-area-inset-bottom, 0px) + 68px)); }
  .foot{ font-size:11px; }
  .hint{ bottom:max(48px, calc(env(safe-area-inset-bottom, 0px) + 44px)); }
}
@media (max-width:420px){
  .mark svg{ display:none; }
  .nav .pill{ height:36px; padding:0 14px; font-size:13px; }
  h1{ max-width:12ch; font-size:clamp(27px, 10.2vw, 40px); }
  .eyebrow{ font-size:11px; letter-spacing:.10em; max-width:100%; }
  .cta .pill{ width:100%; max-width:280px; height:44px; padding:0 20px; font-size:14px; }
}
@media (max-height:520px) and (orientation:landscape){
  .panel,.boot{ padding:max(70px, calc(env(safe-area-inset-top, 0px) + 56px)) 24px max(60px, calc(env(safe-area-inset-bottom, 0px) + 46px)); }
  h1{ font-size:clamp(26px, 7.6vh, 42px); }
  .sub{ margin-top:12px; font-size:14px; max-width:100%; }
  .cta{ margin-top:16px; }
  .rail,.index,.hint{ display:none; }
}
@media (prefers-reduced-motion: reduce){
  .birds{ display:none; }
  .stage::before{ transform:translate(-50%,-50%); }
  .pill{ transition:none; }
}
</style>
</head>
<body>

<script>
(function(){
"use strict";

/* 视频：本地 1920×1080 / 24fps / 144 帧 / 全 I 帧（每帧皆关键帧）。
   全 I 帧是滚动擦动的前提——任意时间点都能瞬间定位到精确帧，
   否则每次 currentTime 跳转都要回退到前一个关键帧再解码，擦动会变成幻灯片。 */
var VIDEO  = "assets/dusk-gulls.mp4";
var POSTER = "assets/dusk-poster.jpg";

/* 章节节奏 [fadeInStart, fadeInEnd, fadeOutStart, fadeOutEnd]，单位是 0..1 的页面进度。
   相邻两段的间隙（0.19→0.27、0.52→0.60、0.85→0.91）是刻意的死区：
   只有视频、没有文字，保证任意时刻不会有两块文案同时可读。
   最后一段的淡出区间在 1.0 之外，即结尾 CTA 常驻不消失。 */
var CUES = [
  [0.00, 0.00, 0.13, 0.19],
  [0.27, 0.34, 0.46, 0.52],
  [0.60, 0.67, 0.79, 0.85],
  [0.91, 0.97, 1.10, 1.20]
];
var DRIFT = 26;      // 每块面板的位移行程（px）
var RAIL_N = 132;    // 右侧竖轨高度，与 CSS 保持一致
var RING_LEN = 119.4;

var docEl = document.documentElement;
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var clip    = document.getElementById("clip");
var stage   = document.getElementById("stage");
var boot    = document.getElementById("boot");
var bootPct = document.getElementById("bootPct");
var bootRing= document.getElementById("bootRing");
var railFill= document.getElementById("railFill");
var idxNum  = document.getElementById("idxNum");
var idxTime = document.getElementById("idxTime");
var hint    = document.getElementById("hint");
var railLis = [].slice.call(document.querySelectorAll("[data-rail]"));

var panels = [].slice.call(document.querySelectorAll("[data-panel]")).map(function(p){
  var items = [].slice.call(p.querySelectorAll("[data-stag]"));
  return {
    el: p,
    items: items,
    // 按钮是错峰入场里最后出现的一个，可点状态必须跟着它自己的透明度走，
    // 否则会出现「按钮已经看得见、却点不动」的空窗。
    cta: p.querySelector(".cta") || items[items.length - 1],
    lastInert: null
  };
});

/* ---------- 基础工具 ---------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function smooth(t){ return t * t * (3 - 2 * t); }          // smoothstep
function ramp(p, a, b){
  if (b <= a) return p >= b ? 1 : 0;
  return smooth(clamp((p - a) / (b - a), 0, 1));
}
/* 同一块面板内，按元素序号错峰入场：让文案一行一行地浮出来 */
function stagedEnter(p, c0, c1, j, n){
  var span = c1 - c0;
  if (span <= 0) return p >= c1 ? 1 : 0;
  var k = n > 1 ? j / (n - 1) : 0;
  var a = c0 + span * 0.45 * k;
  var b = c0 + span * 0.55 + span * 0.45 * k;
  return ramp(p, a, b);
}

/* ---------- 状态 ---------- */
var progress = 0, seekTo = 0, seekAt = 0, duration = 0;
var ready = false, started = false, attached = false;
var maxScroll = 1;

function readScroll(){
  maxScroll = Math.max(1, docEl.scrollHeight - window.innerHeight);
  progress = clamp(window.pageYOffset / maxScroll, 0, 1);
  if (duration) seekTo = progress * duration;
}

/* ---------- 每帧绘制 ---------- */
var canBlur = !reduced && window.matchMedia("(min-width: 721px)").matches;

function paint(){
  docEl.style.setProperty("--dusk", progress.toFixed(4));
  railFill.style.transform = "scaleY(" + progress.toFixed(4) + ")";
  if (hint) hint.style.opacity = progress > 0.035 ? "0" : "1";

  var best = -1, bestV = 0.02;

  for (var i = 0; i < panels.length; i++){
    var c = CUES[i];
    var P = panels[i];
    var n = P.items.length;

    // 面板整体：用于指针事件与可访问性，不做视觉淡出（避免与子元素双重叠加）
    var pv = ramp(progress, c[0], c[1]) * (1 - ramp(progress, c[2], c[3]));
    if (pv > bestV){ bestV = pv; best = i; }

    var leave = ramp(progress, c[2], c[3]);
    var ctaO = 0;
    for (var j = 0; j < n; j++){
      var el = P.items[j];
      var e = stagedEnter(progress, c[0], c[1], j, n);
      var o = e * (1 - leave);
      if (el === P.cta) ctaO = o;
      el.style.opacity = o.toFixed(3);
      el.style.transform = "translate3d(0," +
        ((1 - e) * DRIFT - leave * DRIFT * 0.55).toFixed(2) + "px,0)";
      // 模糊只保留「远处的鸟逐渐聚焦」这一下，且衰减要快：
      // 用 (1-e)^1.6 × 5px，e≈0.5 时就只剩 1.6px。
      // 若用线性 ×7px，中段会出现一个糊成一团的大标题，像渲染故障而不是动效。
      if (canBlur && el.tagName === "H1"){
        var bl = Math.pow(1 - e, 1.6) * 5;
        el.style.filter = bl > 0.15 ? "blur(" + bl.toFixed(2) + "px)" : "";
      }
    }

    // 以按钮自身的可见度决定是否可点：它刚够看清就能点，开始淡出就失效
    var interactive = ctaO > 0.55;
    P.el.style.pointerEvents = interactive ? "auto" : "none";

    // 隐藏的面板从键盘与读屏里摘出去（opacity:0 并不会移除可聚焦性）
    var hidden = pv < 0.15;
    if (hidden !== P.lastInert){
      P.lastInert = hidden;
      if ("inert" in HTMLElement.prototype) P.el.inert = hidden;
      if (hidden) P.el.setAttribute("aria-hidden", "true");
      else P.el.removeAttribute("aria-hidden");
    }
  }

  if (best >= 0){
    for (var k = 0; k < railLis.length; k++){
      railLis[k].classList.toggle("on", k === best);
    }
    idxNum.textContent = "0" + (best + 1);
  }
  if (duration){
    idxTime.textContent = (progress * duration).toFixed(1) + " / " + duration.toFixed(1) + "s";
  }
}

/* ---------- rAF 主循环（永不取消） ---------- */
function frame(){
  if (ready && duration){
    var gap = seekTo - seekAt;
    if (Math.abs(gap) > 0.0008){
      seekAt += gap * 0.115;                 // 缓动系数：把跳跃的擦动磨顺
      if (clip.readyState >= 2 && !clip.seeking){
        try { clip.currentTime = seekAt; } catch (e) {}
      }
    }
  }
  paint();
  requestAnimationFrame(frame);
}

/* ---------- 预加载读数 ---------- */
function setProgress(f){
  f = clamp(f, 0, 1);
  bootPct.textContent = ("0" + Math.round(f * 100)).slice(-2);
  bootRing.style.strokeDashoffset = (RING_LEN * (1 - f)).toFixed(1);
}

/* ---------- 启动 ---------- */
function start(){
  if (started) return;
  started = true;
  ready = true;
  stage.classList.add("is-ready");
  boot.classList.add("done");
  readScroll();
  seekAt = seekTo;
}

/* ---------- 挂载视频源：先绑监听，再设 src ---------- */
function attach(src){
  if (attached) return;
  attached = true;

  clip.addEventListener("loadedmetadata", function(){
    duration = clip.duration || 0;
    clip.pause();
    readScroll();
    seekAt = seekTo;
    try { clip.currentTime = seekAt; } catch (e) {}
  });
  clip.addEventListener("loadeddata", start);
  clip.addEventListener("canplaythrough", start);
  clip.addEventListener("error", start);

  clip.src = src;
  clip.load();
  setTimeout(start, 12000);   // 解码卡死也不要把页面永远锁在预加载器后面
}

/* ---------- 取视频：先整段缓冲成 blob ----------
   在已缓冲的 blob 内 seek 近乎瞬时；走网络 range 请求则是一格一格地等。
   代价是首屏要等下载完成，所以设了 15s 的兜底：超时就改为直接流式播放。 */
function preload(){
  if (reduced){
    // 尊重「减少动态效果」：不下载视频，直接用静帧当背景
    setProgress(1);
    stage.style.backgroundImage = "url(" + POSTER + ")";
    stage.style.backgroundSize = "cover";
    stage.style.backgroundPosition = "center";
    start();
    return;
  }

  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var bailed = false;
  var bail = setTimeout(function(){
    if (!attached){
      bailed = true;
      if (ctrl) ctrl.abort();
      setProgress(1);
      attach(VIDEO);
    }
  }, 15000);

  function done(src){
    clearTimeout(bail);
    setProgress(1);
    attach(src);
  }

  if (typeof fetch !== "function" || !ctrl){
    done(VIDEO);
    return;
  }

  fetch(VIDEO, { signal: ctrl.signal })
    .then(function(res){
      if (!res.ok || !res.body) throw new Error("bad response");
      var total = parseInt(res.headers.get("content-length") || "0", 10) || 0;
      var reader = res.body.getReader();
      var chunks = [], got = 0;

      return (function pump(){
        return reader.read().then(function(r){
          if (r.done) return new Blob(chunks, { type: "video/mp4" });
          chunks.push(r.value);
          got += r.value.length;
          // 没有 content-length 时按本片实际体积（约 6.0MB）估算，封顶 0.95 以免卡在 100%
          setProgress(total ? got / total : Math.min(got / 6.1e6, 0.95));
          return pump();
        });
      })();
    })
    .then(function(blob){
      if (bailed) return;
      done(URL.createObjectURL(blob));
    })
    .catch(function(){
      if (bailed) return;
      done(VIDEO);   // 覆盖 CORS 失败、被 abort、离线
    });
}

/* ---------- iOS 解锁 ── iOS 不会从一个从未播放过的视频里绘制帧 ---------- */
function unlock(){
  var p = clip.play();
  if (p && p.then) p.then(function(){ clip.pause(); }).catch(function(){});
  else clip.pause();
}
["touchstart","pointerdown","wheel","keydown"].forEach(function(ev){
  window.addEventListener(ev, unlock, { once: true, passive: true });
});

/* ---------- 把导航/CTA 变成真正的章节跳转（锚点在 fixed 布局里不会滚动） ---------- */
function goChapter(i){
  var c = CUES[i];
  if (!c) return;
  maxScroll = Math.max(1, docEl.scrollHeight - window.innerHeight);
  var y = ((c[0] + c[1]) / 2) * maxScroll;
  window.scrollTo({ top: y, behavior: reduced ? "auto" : "smooth" });
}
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-go]");
  if (!t) return;
  ev.preventDefault();
  goChapter(parseInt(t.getAttribute("data-go"), 10));
});

/* ---------- 接线 ---------- */
window.addEventListener("scroll", readScroll, { passive: true });
window.addEventListener("resize", function(){
  readScroll();
  canBlur = !reduced && window.matchMedia("(min-width: 721px)").matches;
});

readScroll();
paint();
preload();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
