  <style>
    :root {
      --ink: #f3e9dc;
      --ink-soft: rgba(243, 233, 220, .74);
      --ink-faint: rgba(243, 233, 220, .46);
      --night: #f4ece1;
      --rule: rgba(243, 233, 220, .18);
      --amber: #d99a55;
      --amber-sunk: #c6893f;
      --pill-fg: #14100b;
      --ease: cubic-bezier(.22, .61, .36, 1);
      --dusk: 0;
      --suny: 62%;
      /* 太阳纵向位置：滚动唯一驱动的东西 */
      --sunp: 0;
      /* 太阳升起进度 0~1，用于光强 */
      --sunx: 63%;
      /* 视频里太阳的横向位置：金鳞光带跟着它走 */

      /* ---- 配色：暗调夕阳（墨黑天空 / 黑海面 / 金色霞光） ---- */
      --s-top: 11, 12, 20;
      /* 天空顶（近黑） */
      --s-rose: 34, 24, 34;
      /* 天空暗紫过渡 */
      --s-mid: 88, 52, 46;
      /* 天际暖暗 */
      --s-lor: 255, 184, 104;
      /* 地平线金光 */
      --sea-a: 26, 30, 36;
      /* 远海（暗） */
      --sea-b: 6, 7, 10;
      /* 近海（近黑） */
      --sand: 58, 46, 36;
      /* 暗金沙 */
      --sand2: 26, 23, 21;
      --page: 10, 11, 16;
      /* 页面底色 */
      --wash: 46, 38, 46;
      /* 天空洗染（暗） */
      --wash-a: .34;
      --haze: 255, 176, 102;
      /* 地平线霞光 */
      --chrome: 9, 10, 15;
      /* 顶栏/页脚渐隐底 */
      --veil: 7, 7, 11;
      /* 罩染 */
      --deep: 0, 0, 0;
      /* 暗角 */
      --sun: 255, 192, 124;
      /* 太阳光晕 */
      --tint-op: .96;
      --vid: brightness(.50) contrast(1.22) saturate(.90) sepia(.20);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: rgb(var(--page));
      color: var(--ink);
      font-family: 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    h1,
    h2,
    p,
    ol,
    li,
    figure {
      margin: 0;
      padding: 0;
    }

    ol {
      list-style: none;
    }

    a {
      color: inherit;
    }

    /* ============ 固定背景舞台 ============ */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-color: rgb(var(--page));
      /* 第一层是静帧（100KB，秒开）；万一静帧也失败，退到纯 CSS 海岸渐变 */
      background-image:
        linear-gradient(rgba(8, 9, 14, .74), rgba(8, 9, 14, .74)),
        url("assets/dusk-poster.jpg"),
        linear-gradient(to bottom,
          rgb(var(--s-top)) 0%, rgb(var(--s-rose)) 26%, rgb(var(--s-mid)) 46%,
          rgb(var(--s-lor)) 61%, rgb(var(--s-lor)) 66%,
          rgb(var(--sea-a)) 66.6%, rgb(var(--sea-b)) 100%);
      background-size: cover, cover, cover;
      background-position: center, center, center;
      background-repeat: no-repeat, no-repeat, no-repeat;
    }

    /* CSS 初阳：静帧/CSS 兜底时的太阳，随滚动上升。
   transform 与 opacity 都是合成器属性，逐帧改不触发重绘。 */
    .stage::before {
      content: '';
      position: absolute;
      left: var(--sunx);
      top: var(--suny);
      width: clamp(90px, 9.5vw, 190px);
      height: clamp(90px, 9.5vw, 190px);
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 246, 226, .98) 0%, rgba(var(--sun), .92) 38%, rgba(var(--sun), .30) 64%, rgba(var(--sun), 0) 100%);
      transform: translate(-50%, -50%);
      opacity: calc(1 - var(--dusk) * .80);
    }

    /* 视频一旦就绪，CSS 初阳立刻让位：否则它会以硬边圆盘叠在视频的初阳之上 */
    .stage.is-ready::before {
      opacity: 0;
      visibility: hidden;
    }

    .stage video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      /* 画面上移 7%，太阳在屏内抬高；scale 补足位移带来的边缘露出 */
      transform: translate(-50%, -50%) translateY(-7%) scale(1.16);
      object-fit: cover;
      filter: var(--vid);
      opacity: 0;
      transition: opacity 1.1s var(--ease);
      background: transparent;
    }

    .stage.is-ready video {
      opacity: 1;
    }

    /* 极淡罩染：只在顶/底给导航与页脚留一点可读底，画面保持通透清晰 */
    .veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background:
        linear-gradient(to bottom,
          rgba(var(--veil), .14) 0%, rgba(var(--veil), .04) 18%, rgba(var(--veil), 0) 42%,
          rgba(var(--veil), .08) 72%, rgba(var(--veil), .24) 100%),
        radial-gradient(140% 122% at 50% 46%, rgba(var(--veil), 0) 55%, rgba(var(--deep), .10) 100%);
    }

    /* 天光层：滚动越深略微收敛，仍然明亮 */
    .night {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: rgb(var(--s-mid));
      opacity: .08;
    }

    .grain {
      position: absolute;
      inset: -50%;
      pointer-events: none;
      opacity: .07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
    }

    /* ============ 海岸色彩重映射 ============
   mix-blend-mode:color 只替换色相/饱和度、保留视频原有明暗，
   于是落日的构图被原样保住，颜色却变成「上天空、下海面」的自然海岸。 */
    .tint {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: color;
      opacity: var(--tint-op);
      background: linear-gradient(to bottom,
          rgb(var(--s-top)) 0%, rgb(var(--s-rose)) 24%, rgb(var(--s-mid)) 42%,
          rgb(var(--s-lor)) 56%, rgb(var(--s-lor)) 65.6%,
          rgb(var(--sea-a)) 67%, rgb(var(--sea-b)) 100%);
    }

    /* ============ 暗场：天空与海面压向夜色 ============
   径向「光洞」以太阳位置为中心，靠近太阳处几乎全透明，
   越远越沉，于是画面只剩夕阳一圈暖光，其余沉入黑。
   压在 tint 之上、浪与金鳞之下 —— 光不会被压掉，暗部才会。 */
    .duskdim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(64% 48% at var(--sunx) var(--suny),
          rgba(10, 8, 12, 0) 0%,
          rgba(10, 8, 12, .06) 16%,
          rgba(10, 8, 12, .26) 38%,
          rgba(9, 8, 12, .58) 64%,
          rgba(8, 7, 11, .76) 84%,
          rgba(8, 7, 11, .82) 100%),
        linear-gradient(to bottom,
          rgba(7, 8, 13, .72) 0%,
          rgba(7, 8, 13, .54) 26%,
          rgba(7, 8, 13, .28) 48%,
          rgba(7, 8, 13, .08) 62%,
          rgba(5, 6, 10, .26) 72%,
          rgba(4, 5, 9, .48) 100%);
    }

    /* ============ 太阳光晕：单独把太阳点亮 ============
   暗场压暗整幅画面后，太阳也跟着变灰。这一层以太阳为圆心，
   用 screen 混合叠一圈暖白光——只加光、不减暗，暗部不受影响。 */
    .sunbloom {
      position: absolute;
      left: var(--sunx);
      top: var(--suny);
      width: clamp(250px, 32vw, 440px);
      aspect-ratio: 1/1;
      /* 随升高略微收小：低空的大气放大感，到高空更接近一颗正常日轮 */
      transform: translate(-50%, -50%) scale(calc(1.04 - var(--sunp) * .18));
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 7;
      background:
        radial-gradient(closest-side,
          rgba(255, 238, 206, .82) 0%,
          rgba(255, 232, 194, .74) 11%,
          rgba(255, 222, 174, .52) 18%,
          rgba(255, 208, 156, .30) 27%,
          rgba(255, 194, 140, .14) 39%,
          rgba(255, 182, 126, .05) 55%,
          rgba(255, 176, 120, 0) 74%);
      filter: blur(6px);
    }

    /* ============ 太阳照亮周围 ============
   以太阳为圆心、远大于日轮的一圈暖光，screen 叠加把附近天空与海面整体提亮，
   于是太阳升到哪，哪一片就被照亮；越远衰减越快，不会把整幅画面冲白。 */
    .sunglow {
      position: absolute;
      left: var(--sunx);
      top: var(--suny);
      width: min(150vw, 1900px);
      aspect-ratio: 1/1.06;
      transform: translate(-50%, -50%);
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 6;
      background: radial-gradient(closest-side,
          rgba(255, 214, 164, .22) 0%,
          rgba(255, 198, 140, .16) 24%,
          rgba(255, 180, 120, .085) 46%,
          rgba(255, 168, 106, .035) 68%,
          rgba(255, 160, 96, 0) 86%);
      filter: blur(30px);
      opacity: calc(.62 + var(--sunp) * .24);
    }

    /* ============ 沙滩浅海：近处沙底、远处渐深 ============
   底部铺沙色，越靠近画面底缘越透出沙滩，形成「近岸浅滩、远海深蓝」的远近纵深感。 */
    .sandbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34%;
      pointer-events: none;
      z-index: 4;
      background: linear-gradient(to top,
          rgb(var(--sand)) 0%, rgb(var(--sand2)) 32%,
          rgba(var(--sea-a), .90) 70%, rgba(var(--sea-a), 0) 100%);
      mix-blend-mode: screen;
      opacity: .10;
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .7) 45%, rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .7) 45%, rgba(0, 0, 0, 0) 100%);
    }

    /* ============ 夕阳倒影：太阳正下方一道金色光带 ============
   横向拉丝 + 纵向渐隐，顶端用 mask 渐入，避免硬截断。 */
    .sunpath {
      position: absolute;
      left: var(--sunx);
      top: max(calc(var(--suny) + 2.4%), 63%);
      bottom: 0;
      width: min(42vw, 540px);
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: calc(.80 - var(--dusk) * .18);
      background:
        repeating-linear-gradient(to bottom,
          rgba(255, 238, 194, .44) 0 1px, rgba(255, 238, 194, 0) 1px 8px),
        linear-gradient(to bottom,
          rgba(255, 224, 164, .78) 0%, rgba(255, 198, 120, .42) 30%, rgba(255, 180, 96, 0) 90%);
      /* 两层 mask 相交：纵向顶部 8% 渐入 × 径向横向收束，光带顶端不再有硬截断 */
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000 8%), radial-gradient(46% 84% at 50% 0%, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .55) 42%, rgba(0, 0, 0, 0) 84%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000 8%), radial-gradient(46% 84% at 50% 0%, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .55) 42%, rgba(0, 0, 0, 0) 84%);
      mask-composite: intersect;
      filter: blur(5px);
    }

    /* ============ 景深（人眼立体感） ============
   天空保持通透不罩雾；纵深集中在海面：地平线留一条极淡的海天分界光，
   近岸（底缘）略微加深，与沙底浅滩叠加出「近浅、远深」的层次。 */
    .depth {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background:
        linear-gradient(to bottom,
          rgba(var(--wash), calc(var(--wash-a) * .58)) 0%,
          rgba(var(--wash), calc(var(--wash-a) * .42)) 22%,
          rgba(var(--wash), calc(var(--wash-a) * .24)) 42%,
          rgba(var(--wash), 0) 56%),
        linear-gradient(to bottom,
          rgba(var(--haze), 0) 42%, rgba(var(--haze), .09) 50%,
          rgba(var(--haze), .17) 57%, rgba(var(--haze), .06) 62%, rgba(var(--haze), 0) 67%),
        linear-gradient(to bottom,
          rgba(var(--sun), 0) 62%, rgba(var(--sun), .50) 65.6%, rgba(var(--sun), 0) 69%),
        linear-gradient(to top, rgba(var(--deep), .08) 0%, rgba(var(--deep), .03) 18%, rgba(var(--deep), 0) 34%),
        radial-gradient(150% 130% at 50% 50%, rgba(0, 0, 0, 0) 68%, rgba(var(--deep), .06) 100%);
    }

    /* ============ 白云：几团软云在天空区缓慢横移 ============
   云团用 radial-gradient 叠出体积、再 blur 化开边缘；
   动画只动 transform，交给合成器，滚动时不掉帧。
   mask 让云往下渐隐，避免糊到地平线上。 */
    .clouds {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 56%;
      pointer-events: none;
      overflow: hidden;
      z-index: 8;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .95) 38%, rgba(0, 0, 0, .42) 64%, rgba(0, 0, 0, 0) 84%);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .95) 38%, rgba(0, 0, 0, .42) 64%, rgba(0, 0, 0, 0) 84%);
    }

    .cloud {
      position: absolute;
      left: 0;
      aspect-ratio: 16/6;
      filter: blur(4px);
      will-change: transform;
      background:
        radial-gradient(closest-side at 24% 78%, #2b2534 0%, #2b2534 34%, rgba(43, 37, 52, .62) 52%, rgba(255, 255, 255, 0) 70%),
        radial-gradient(closest-side at 42% 54%, #332c3c 0%, #332c3c 38%, rgba(51, 44, 60, .66) 55%, rgba(255, 255, 255, 0) 72%),
        radial-gradient(closest-side at 61% 42%, #2f2838 0%, #2f2838 36%, rgba(47, 40, 56, .64) 54%, rgba(255, 255, 255, 0) 71%),
        radial-gradient(closest-side at 79% 66%, #282232 0%, #282232 32%, rgba(40, 34, 50, .58) 50%, rgba(255, 255, 255, 0) 69%),
        radial-gradient(closest-side at 50% 88%, #2b2534 0%, rgba(43, 37, 52, .62) 40%, rgba(43, 37, 52, 0) 64%);
      animation-name: drift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .cloud-1 {
      top: 4%;
      width: 46vw;
      opacity: .46;
      animation-duration: 96s;
    }

    .cloud-2 {
      top: 17%;
      width: 34vw;
      opacity: .36;
      animation-duration: 126s;
      animation-delay: 8s;
    }

    .cloud-3 {
      top: 29%;
      width: 26vw;
      opacity: .26;
      animation-duration: 152s;
      animation-delay: 30s;
    }

    .cloud-4 {
      top: 2%;
      width: 19vw;
      opacity: .22;
      animation-duration: 170s;
      animation-delay: 52s;
    }

    @keyframes drift {
      0% {
        transform: translate3d(-62vw, 8px, 0) scale(.96);
      }

      50% {
        transform: translate3d(30vw, -10px, 0) scale(1.03);
      }

      100% {
        transform: translate3d(122vw, 6px, 0) scale(1);
      }
    }

    /* ============ 顶栏 / 页脚 / 右侧章节轨 ============ */
    .chrome {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: max(14px, calc(env(safe-area-inset-top, 0px) + 12px)) clamp(18px, 3.6vw, 54px) 14px;
      background: linear-gradient(to bottom, rgba(var(--chrome), .92) 0%, rgba(var(--chrome), .64) 68%, rgba(var(--chrome), 0) 100%);
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
      letter-spacing: .01em;
      min-width: 0;
    }

    .mark svg {
      width: 24px;
      height: 14px;
      flex-shrink: 0;
      fill: none;
      stroke: var(--amber);
      stroke-width: 2.1;
      stroke-linecap: round;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2.4vw, 30px);
      flex-shrink: 0;
    }

    /* 首页：绝对居中，左右两侧宽度怎么变都不会把它挤歪 */
    .home {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--ink);
      text-decoration: none;
      font-size: 14.5px;
      letter-spacing: .18em;
      opacity: .86;
      padding: 6px 2px;
      transition: opacity .3s var(--ease);
    }

    .home:hover {
      opacity: 1;
    }

    .home:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .nav a:not(.pill) {
      color: var(--ink);
      text-decoration: none;
      font-size: 14.5px;
      opacity: .86;
      cursor: pointer;
      transition: opacity .3s var(--ease);
    }

    .nav a:not(.pill):hover {
      opacity: 1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--amber);
      color: var(--pill-fg);
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: .01em;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid rgba(255, 235, 205, .28);
      box-shadow: 0 8px 24px -10px rgba(0, 0, 0, .75), 0 1px 0 rgba(255, 255, 255, .32) inset;
      -webkit-text-fill-color: var(--pill-fg);
      transition: transform .4s var(--ease), background .3s var(--ease);
    }

    .nav .pill {
      color: var(--pill-fg);

    }

    /* ============ 欢迎语周围的金屑 ============
   原先海面上铺了一整层闪点（.glitter），密、抢戏。这里改成只在六个毛笔字
   外圈浮一圈细金屑：各自错相明灭、慢慢上浮，像墨迹未干时腾起的一点金粉。 */
    .hero-mark {
      position: relative;
      display: inline-block;
      max-width: 100%;

      position: relative;
      z-index: 1;

    .orbit {
      position: absolute;
      inset: -26% -17%;
      pointer-events: none;
      z-index: 0;
    }

    .orbit i {
      position: absolute;
      width: 3px;
      height: 3px;
      margin: -1px 0 0 -1px;
      border-radius: 50%;
      background: radial-gradient(circle,
          rgba(255, 242, 212, 1) 0%,
          rgba(255, 210, 150, .85) 40%,
          rgba(255, 190, 120, 0) 100%);
      opacity: 0;
      will-change: opacity, transform;
      animation:
        mote var(--dur, 7s) ease-in-out var(--delay, 0s) infinite,
        moteFloat calc(var(--dur, 7s) * 2.2) ease-in-out var(--delay, 0s) infinite alternate;
    }

    @keyframes mote {

      0%,
      100% {
        opacity: 0;
      }

      42% {
        opacity: .95;
      }

      62% {
        opacity: .42;
      }

      80% {
        opacity: .85;

    @keyframes moteFloat {

        transform: translate3d(0, 0, 0) scale(.85);

  <p class="hint" id="hint" data-page-node-id="59O4Dp4hnjB8ie44dwbdpt">滚动，升起太阳 <b
      data-page-node-id="QaPtJr1duyzSsZyINIsPsL">↓</b></p>

  <!-- 唯一的页面高度来源 -->
  <div class="track" data-page-node-id="jZaxLAxjqczrij8D2BFxKJ"></div>

  <script>
    (function () {
      "use strict";

      /* 视频：本地 1920×1080 / 24fps / 144 帧 / 全 I 帧（每帧皆关键帧）。
         全 I 帧是滚动擦动的前提——任意时间点都能瞬间定位到精确帧，
         否则每次 currentTime 跳转都要回退到前一个关键帧再解码，擦动会变成幻灯片。 */
      var VIDEO = "assets/dusk-sea.mp4";
      var POSTER = "assets/dusk-poster.jpg";

      /* 章节节奏 [fadeInStart, fadeInEnd, fadeOutStart, fadeOutEnd]，单位是 0..1 的页面进度。
         相邻两段的间隙（0.19→0.27、0.52→0.60、0.85→0.91）是刻意的死区：
         只有视频、没有文字，保证任意时刻不会有两块文案同时可读。
         最后一段的淡出区间在 1.0 之外，即结尾 CTA 常驻不消失。 */
      var CUES = [
        [0.00, 0.00, 0.13, 0.19],
        [0.27, 0.34, 0.46, 0.52],
        [0.60, 0.67, 0.79, 0.85],
        [0.91, 0.97, 1.10, 1.20]
      ];
      var DRIFT = 26;      // 每块面板的位移行程（px）
      var RAIL_N = 132;    // 右侧竖轨高度，与 CSS 保持一致
      var RING_LEN = 119.4;

      var docEl = document.documentElement;
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var clip = document.getElementById("clip");
      var stage = document.getElementById("stage");
      var boot = document.getElementById("boot");
      var bootPct = document.getElementById("bootPct");
      var bootRing = document.getElementById("bootRing");
      var railFill = document.getElementById("railFill");
      var idxNum = document.getElementById("idxNum");
      var idxTime = document.getElementById("idxTime");
      var hint = document.getElementById("hint");
      var railLis = [].slice.call(document.querySelectorAll("[data-rail]"));

      var panels = [].slice.call(document.querySelectorAll("[data-panel]")).map(function (p) {
        var items = [].slice.call(p.querySelectorAll("[data-stag]"));
        return {
          el: p,
          items: items,
          // 按钮是错峰入场里最后出现的一个，可点状态必须跟着它自己的透明度走，
          // 否则会出现「按钮已经看得见、却点不动」的空窗。
          cta: p.querySelector(".cta") || items[items.length - 1],
          lastInert: null
        };
      });

      /* ---------- 基础工具 ---------- */
      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
      function smooth(t) { return t * t * (3 - 2 * t); }          // smoothstep
      function ramp(p, a, b) {
        if (b <= a) return p >= b ? 1 : 0;
        return smooth(clamp((p - a) / (b - a), 0, 1));
      }
      /* 同一块面板内，按元素序号错峰入场：让文案一行一行地浮出来 */
      function stagedEnter(p, c0, c1, j, n) {
        var span = c1 - c0;
        if (span <= 0) return p >= c1 ? 1 : 0;
        var k = n > 1 ? j / (n - 1) : 0;
        var a = c0 + span * 0.45 * k;
        var b = c0 + span * 0.55 + span * 0.45 * k;
        return ramp(p, a, b);
      }

      /* ---------- 状态 ---------- */
      var progress = 0, seekTo = 0, seekAt = 0, duration = 0, sunY = 62;
      var VSTART = 0;      // 视频定格在开头这一帧，画面不再随滚动变化
      var ready = false, started = false, attached = false;
      var maxScroll = 1;
      var SUN_Y0 = 62, SUN_Y1 = 16;   // 太阳纵向行程：海平线上 → 高空（%）
      var lastDusk = -1, lastSunY = -1;

      function readScroll() {
        maxScroll = Math.max(1, docEl.scrollHeight - window.innerHeight);
        progress = clamp(window.pageYOffset / maxScroll, 0, 1);
        seekTo = 0;                      // 定格：不再擦帧
        sunY = SUN_Y0 - (SUN_Y0 - SUN_Y1) * progress;   // 滚动只升降太阳
      }

      /* ---------- 每帧绘制 ---------- */
      var canBlur = !reduced && window.matchMedia("(min-width: 721px)").matches;

      function paint() {
        // 只在数值真的变了才写回去：rAF 每帧都跑，避免无谓的样式重算
        if (progress !== lastDusk) {
          lastDusk = progress;
          docEl.style.setProperty("--dusk", progress.toFixed(4));
          docEl.style.setProperty("--sunp", progress.toFixed(4));
          railFill.style.transform = "scaleY(" + progress.toFixed(4) + ")";
          if (hint) hint.style.opacity = progress > 0.035 ? "0" : "1";
        }
        if (sunY !== lastSunY) {
          lastSunY = sunY;
          docEl.style.setProperty("--suny", sunY.toFixed(2) + "%");
        }

        var best = -1, bestV = 0.02;

        for (var i = 0; i < panels.length; i++) {
          var c = CUES[i];
          var P = panels[i];
          var n = P.items.length;

          // 面板整体：用于指针事件与可访问性，不做视觉淡出（避免与子元素双重叠加）
          var pv = ramp(progress, c[0], c[1]) * (1 - ramp(progress, c[2], c[3]));
          if (pv > bestV) { bestV = pv; best = i; }

          var leave = ramp(progress, c[2], c[3]);
          var ctaO = 0;
          for (var j = 0; j < n; j++) {
            var el = P.items[j];
            var e = stagedEnter(progress, c[0], c[1], j, n);
            var o = e * (1 - leave);
            if (el === P.cta) ctaO = o;
            el.style.opacity = o.toFixed(3);
            el.style.transform = "translate3d(0," +
              ((1 - e) * DRIFT - leave * DRIFT * 0.55).toFixed(2) + "px,0)";
            // 模糊只保留「远处的鸟逐渐聚焦」这一下，且衰减要快：
            // 用 (1-e)^1.6 × 5px，e≈0.5 时就只剩 1.6px。
            // 若用线性 ×7px，中段会出现一个糊成一团的大标题，像渲染故障而不是动效。
            if (canBlur && el.tagName === "H1") {
              var bl = Math.pow(1 - e, 1.6) * 5;
              el.style.filter = bl > 0.15 ? "blur(" + bl.toFixed(2) + "px)" : "";
            }
          }

          // 以按钮自身的可见度决定是否可点：它刚够看清就能点，开始淡出就失效
          var interactive = ctaO > 0.55;
          P.el.style.pointerEvents = interactive ? "auto" : "none";

          // 隐藏的面板从键盘与读屏里摘出去（opacity:0 并不会移除可聚焦性）
          var hidden = pv < 0.15;
          if (hidden !== P.lastInert) {
            P.lastInert = hidden;
            if ("inert" in HTMLElement.prototype) P.el.inert = hidden;
            if (hidden) P.el.setAttribute("aria-hidden", "true");
            else P.el.removeAttribute("aria-hidden");
          }
        }

        if (best >= 0) {
          for (var k = 0; k < railLis.length; k++) {
            railLis[k].classList.toggle("on", k === best);
          }
          idxNum.textContent = "0" + (best + 1);
        }
        idxTime.textContent = "太阳 " + Math.round(progress * 100) + "%";
      }

      /* ---------- rAF 主循环（永不取消） ---------- */
      function frame() {
        if (ready && duration && !clip.seeking && clip.currentTime > 0.02) {
          try { clip.currentTime = 0; } catch (e) { }   // 定格：任何漂帧都拉回开头
        }
        if (ready && duration) {
          var gap = seekTo - seekAt;
          if (Math.abs(gap) > 0.0008) {
            seekAt += gap * 0.115;                 // 缓动系数：把跳跃的擦动磨顺
            if (clip.readyState >= 2 && !clip.seeking) {
              try { clip.currentTime = seekAt; } catch (e) { }
            }
          }
        }
        paint();
        requestAnimationFrame(frame);
      }

      /* ---------- 预加载读数 ---------- */
      function setProgress(f) {
        f = clamp(f, 0, 1);
        bootPct.textContent = ("0" + Math.round(f * 100)).slice(-2);
        bootRing.style.strokeDashoffset = (RING_LEN * (1 - f)).toFixed(1);
      }

      /* ---------- 启动 ---------- */
      function start() {
        if (started) return;
        started = true;
        ready = true;
        stage.classList.add("is-ready");
        boot.classList.add("done");
        readScroll();
        seekAt = seekTo;
      }

      /* ---------- 首屏揭幕 ----------
         以前要等整段视频下载完才淡出预加载器，弱网下要干等十几秒。
         现在静帧一解码出来就揭幕（最多等 1.2s），视频继续在后台下载，
         下完再淡入接管；在那之前滚动不擦动而已，页面本身已经可以看。 */
      var revealed = false;
      function reveal() {
        if (revealed) return;
        revealed = true;
        setProgress(1);
        start();
      }

      /* ---------- 挂载视频源：先绑监听，再设 src ---------- */
      function attach(src) {
        if (attached) return;
        attached = true;

        clip.addEventListener("loadedmetadata", function () {
          duration = clip.duration || 0;
          clip.pause();
          readScroll();
          seekAt = seekTo;
          try { clip.currentTime = seekAt; } catch (e) { }
        });
        clip.addEventListener("loadeddata", start);
        clip.addEventListener("canplaythrough", start);
        clip.addEventListener("error", start);

        clip.src = src;
        clip.load();
        setTimeout(start, 12000);   // 解码卡死也不要把页面永远锁在预加载器后面
      }

      /* ---------- 取视频：先整段缓冲成 blob ----------
         在已缓冲的 blob 内 seek 近乎瞬时；走网络 range 请求则是一格一格地等。
         代价是首屏要等下载完成，所以设了 15s 的兜底：超时就改为直接流式播放。 */
      function preload() {
        if (reduced) {
          // 尊重「减少动态效果」：不下载视频，直接用静帧当背景
          setProgress(1);
          stage.style.backgroundImage = "url(" + POSTER + ")";
          stage.style.backgroundSize = "cover";
          stage.style.backgroundPosition = "center";
          start();
          return;
        }

        var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
        var bailed = false;
        var bail = setTimeout(function () {
          if (!attached) {
            bailed = true;
            if (ctrl) ctrl.abort();
            setProgress(1);
            attach(VIDEO);
          }
        }, 15000);

        function done(src) {
          clearTimeout(bail);
          setProgress(1);
          attach(src);
        }

        if (typeof fetch !== "function" || !ctrl) {
          done(VIDEO);
          return;
        }

        fetch(VIDEO, { signal: ctrl.signal })
          .then(function (res) {
            if (!res.ok || !res.body) throw new Error("bad response");
            var total = parseInt(res.headers.get("content-length") || "0", 10) || 0;
            var reader = res.body.getReader();
            var chunks = [], got = 0;

            return (function pump() {
              return reader.read().then(function (r) {
                if (r.done) return new Blob(chunks, { type: "video/mp4" });
                chunks.push(r.value);
                got += r.value.length;
                // 没有 content-length 时按本片实际体积（约 6.0MB）估算，封顶 0.95 以免卡在 100%
                setProgress(total ? got / total : Math.min(got / 6.1e6, 0.95));
                return pump();
              });
            })();
          })
          .then(function (blob) {
            if (bailed) return;
            done(URL.createObjectURL(blob));
          })
          .catch(function () {
            if (bailed) return;
            done(VIDEO);   // 覆盖 CORS 失败、被 abort、离线
          });
      }

      /* ---------- iOS 解锁 ── iOS 不会从一个从未播放过的视频里绘制帧 ---------- */
      function unlock() {
        var p = clip.play();
        if (p && p.then) p.then(function () { clip.pause(); }).catch(function () { });
        else clip.pause();
      }
      ["touchstart", "pointerdown", "wheel", "keydown"].forEach(function (ev) {
        window.addEventListener(ev, unlock, { once: true, passive: true });
      });

      /* ---------- 把导航/CTA 变成真正的章节跳转（锚点在 fixed 布局里不会滚动） ---------- */
      function goChapter(i) {
        var c = CUES[i];
        if (!c) return;
        maxScroll = Math.max(1, docEl.scrollHeight - window.innerHeight);
        // 落在「已完全显示、还没开始退场」的平台区中点：(淡入结束 + 退场开始) / 2
        // 以前取淡入区间中点，跳过去时面板才刚淡到一半，还得再滑一下才看得清按钮
        var holdEnd = Math.min(c[2], 1);
        var at = (c[1] + Math.max(c[1], holdEnd)) / 2;
        var y = at * maxScroll;
        window.scrollTo({ top: y, behavior: reduced ? "auto" : "smooth" });
      }
      var homeLink = document.querySelector("[data-top]");
      if (homeLink) {
        homeLink.addEventListener("click", function (ev) {
          ev.preventDefault();
          window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
        });
      }

      document.addEventListener("click", function (ev) {
        var t = ev.target.closest("[data-go]");
        if (!t) return;
        ev.preventDefault();
        goChapter(parseInt(t.getAttribute("data-go"), 10));
      });

      /* ---------- 接线 ---------- */
      window.addEventListener("scroll", readScroll, { passive: true });
      window.addEventListener("resize", function () {
        readScroll();
        canBlur = !reduced && window.matchMedia("(min-width: 721px)").matches;
      });

      readScroll();
      paint();

      // 静帧能画出来就揭幕；同时给 1.2s 兜底，别让"图还没到"把页面锁住
      (function watchPoster() {
        if (typeof Image === "function") {
          var im = new Image();
          im.onload = reveal;
          im.onerror = reveal;
          im.src = POSTER;
        }
        setTimeout(reveal, 1200);
      })();

      /* ---------- 欢迎语周围的金屑：沿一圈椭圆撒点，各自错相明灭 ---------- */
      (function dustRing() {
        var orbit = document.querySelector(".orbit");
        if (!orbit) return;
        var N = 26;
        for (var i = 0; i < N; i++) {
          var a = (i / N) * Math.PI * 2 + (i % 4) * 0.11;
          var rx = 49 + (i % 3) * 4;       // 横向半径（占容器宽度的百分比）
          var ry = 52 + (i % 4) * 3;       // 纵向半径
          var d = document.createElement("i");
          d.style.left = (50 + Math.cos(a) * rx).toFixed(2) + "%";
          d.style.top = (50 + Math.sin(a) * ry).toFixed(2) + "%";
          d.style.setProperty("--dur", (5.2 + (i % 6) * 1.15).toFixed(2) + "s");
          d.style.setProperty("--delay", (-(i * 0.83) % 7).toFixed(2) + "s");
          d.style.setProperty("--dx", ((i % 2 ? 1 : -1) * (2 + i % 4)) + "px");
          d.style.setProperty("--dy", (-(5 + (i % 5) * 2)) + "px");
          var sz = i % 6 === 0 ? 5 : (i % 3 === 0 ? 3.5 : 2.5);
          d.style.width = d.style.height = sz + "px";
          orbit.appendChild(d);
        }
      })();

      preload();
      requestAnimationFrame(frame);

    })();
  </script>
